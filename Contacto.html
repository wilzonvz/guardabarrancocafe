<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto | Guardabarranco Café</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="Logo.png" type="image/png">
</head>
<body>
    <header>
        <nav class="navbar">
            <div class="logo-container">
                <img src="Logo.png" alt="Logo" class="main-logo">
                <span class="brand-text">Guardabarranco <span>Café</span></span>
            </div>
            <ul class="nav-links">
                <li><a href="index.html">Inicio</a></li>
                <li><a href="blog.html">Blog</a></li>
                <li><a href="contacto.html">Contacto</a></li>
            </ul>
        </nav>
    </header>

    <section class="contact-area">
        <div class="container">
            <h2 class="section-title">Contacto</h2>
            <div class="contact-wrapper">
                <form class="contact-form">
                    <div class="form-group">
                        <label>Nombre</label>
                        <input type="text" placeholder="Tu nombre" required>
                    </div>
                    <div class="form-group">
                        <label>Correo</label>
                        <input type="email" placeholder="ejemplo@correo.com" required>
                    </div>
                    <div class="form-group">
                        <label>Mensaje</label>
                        <textarea placeholder="¿Cómo podemos ayudarte?" rows="5"></textarea>
                    </div>
                    <button type="submit" class="btn-filled">Enviar Mensaje</button>
                </form>
            </div>
        </div>
    </section>

    <footer><p>&copy; 2026 Guardabarranco Café.</p></footer>
</body>
</html>
